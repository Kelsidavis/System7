name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

# Keep actions/checkout's temporary repositories from emitting Git's
# first-branch-name hint in every release job.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # The ARM64 kernel is built separately because its cross-compiler conflicts
  # with the x86 build dependencies.
  build-arm64:
    name: Build ARM64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            python3 \
            vim-common

      - name: Build kernel (ARM64, QEMU virt)
        run: |
          make PLATFORM=arm64
          cp kernel.elf kernel-arm64.elf

      - name: Upload ARM64 kernel
        uses: actions/upload-artifact@v7
        with:
          name: release-kernel-arm64
          path: kernel-arm64.elf

  build-release:
    name: Build Release
    runs-on: ubuntu-24.04
    needs: build-arm64

    steps:
      - name: Get commit SHA
        id: get_sha
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "SHA=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "IS_TAG=true" >> $GITHUB_OUTPUT
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "SHA=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "IS_TAG=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.get_sha.outputs.SHA }}
          fetch-depth: 0  # Full history for version calculation

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            xorriso \
            python3 \
            vim-common

      - name: Build
        run: |
          # English
          make clean
          make PLATFORM=x86
          make iso
          cp kernel.elf kernel-x86.elf
          cp system71.iso system71-english.iso
          # All languages
          make clean
          make PLATFORM=x86 LOCALE_ALL=1
          make iso
          cp kernel.elf kernel-x86-all-languages.elf
          cp system71.iso system71-all-languages.iso

      - name: Fetch the ARM64 kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name release-kernel-arm64 --dir .

      - name: Generate version
        id: version
        run: |
          if [[ "${{ steps.get_sha.outputs.IS_TAG }}" == "true" ]]; then
            # Use the tag version if triggered by a tag
            VERSION="${{ steps.get_sha.outputs.TAG_NAME }}"
          else
            # Auto-generate version: v0.1.{commit_count}-{short_sha}
            COMMIT_COUNT=$(git rev-list --count HEAD)
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="v0.1.${COMMIT_COUNT}-${SHORT_SHA}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "${{ steps.version.outputs.VERSION }}" &>/dev/null; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.VERSION }} already exists, will update it"
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
            echo "Will create new release ${{ steps.version.outputs.VERSION }}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: System7 ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            system71-english.iso
            system71-all-languages.iso
            kernel-x86.elf
            kernel-x86-all-languages.elf
            kernel-arm64.elf
          body: |
            ## System7 ${{ steps.version.outputs.VERSION }}

            **Commit:** ${{ steps.get_sha.outputs.SHA }}

            ### Downloads

            - `system71-english.iso` - bootable ISO, English
            - `system71-all-languages.iso` - bootable ISO with every language built in
              (choose one at boot with `lang=xx` on the kernel command line)
            - `kernel-x86.elf`, `kernel-x86-all-languages.elf` - the x86 kernels on their own
            - `kernel-arm64.elf` - ARM64 kernel for QEMU's `virt` machine

            ### Running
            ```bash
            qemu-system-i386 -cdrom system71-english.iso -m 1024 -vga std \
                -device qemu-xhci,id=xhci -device usb-tablet,bus=xhci.0 -serial stdio
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
