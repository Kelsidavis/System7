name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-x86:
    name: Build x86
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            xorriso \
            python3 \
            vim-common

      - name: Build kernel (English)
        run: make PLATFORM=x86

      - name: Build ISO (English)
        run: make iso

      - name: Display build info
        run: make info

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-x86
          path: kernel.elf

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: system71-iso
          path: system71.iso

  build-locales:
    name: Build Locale ISO
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang:
          - en
          - de
          - es
          - fr
          - zh
          - tw

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            xorriso \
            python3 \
            vim-common

      - name: Verify resource generation
        run: |
          echo "Generating ${{ matrix.lang }} resources..."
          python3 gen_rsrc.py resources/strings/${{ matrix.lang }}.json /tmp/test_${{ matrix.lang }}.rsrc

      - name: Build kernel (single locale)
        run: |
          LANG_CODE="${{ matrix.lang }}"
          if [[ "$LANG_CODE" == "en" ]]; then
            make PLATFORM=x86
          else
            LANG_UPPER=$(echo "$LANG_CODE" | tr '[:lower:]' '[:upper:]')
            make PLATFORM=x86 "LOCALE_${LANG_UPPER}=1"
          fi

      - name: Build ISO
        run: make iso

      - name: Rename ISO
        run: mv system71.iso system71-${{ matrix.lang }}.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: system71-iso-${{ matrix.lang }}
          path: system71-${{ matrix.lang }}.iso

  build-all-locales:
    name: Build All Locales ISO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            xorriso \
            python3 \
            vim-common

      - name: Build multi-language kernel
        run: make PLATFORM=x86 LOCALE_FR=1 LOCALE_DE=1 LOCALE_ES=1 LOCALE_JA=1 LOCALE_ZH=1 LOCALE_KO=1 LOCALE_RU=1 LOCALE_UK=1 LOCALE_PL=1 LOCALE_CS=1 LOCALE_SQ=1 LOCALE_BG=1 LOCALE_HR=1 LOCALE_DA=1 LOCALE_NL=1 LOCALE_ET=1 LOCALE_FI=1 LOCALE_EL=1 LOCALE_HU=1 LOCALE_IS=1 LOCALE_IT=1 LOCALE_LV=1 LOCALE_LT=1 LOCALE_MK=1 LOCALE_ME=1 LOCALE_NO=1 LOCALE_PT=1 LOCALE_RO=1 LOCALE_SK=1 LOCALE_SL=1 LOCALE_SV=1 LOCALE_TR=1 LOCALE_HI=1 LOCALE_TW=1 LOCALE_AR=1 LOCALE_BN=1 LOCALE_UR=1

      - name: Build multi-language ISO
        run: make iso

      - name: Upload multi-language ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: system71-iso-all-languages
          path: system71.iso


  build-arm:
    name: Build ARM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-arm-linux-gnueabihf \
            python3 \
            vim-common

      - name: Build kernel (ARM)
        run: make PLATFORM=arm
        continue-on-error: true

      - name: Upload ARM kernel artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kernel-arm
          path: kernel.elf

  test-qemu:
    name: QEMU Boot Test
    runs-on: ubuntu-latest
    needs: build-x86

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: system71-iso

      # This step used to pipe everything to `|| true` and echo success
      # unconditionally, so it passed even when the kernel never started at all.
      # It now asserts on the serial log, which is what makes it a real test.
      - name: Test QEMU boot (headless, BIOS)
        run: |
          set -euo pipefail
          timeout 60s qemu-system-i386 \
            -cdrom system71.iso \
            -display none \
            -serial file:bios-serial.log \
            -m 1024 -vga std \
            -no-reboot || true

          echo "--- last 20 lines of serial ---"
          tail -20 bios-serial.log || true

          if ! grep -q "Entering event loop" bios-serial.log; then
            echo "::error::Kernel never reached the event loop"
            exit 1
          fi
          if grep -q "CPU EXCEPTION" bios-serial.log; then
            echo "::error::Kernel took a CPU exception during boot"
            grep -A3 "CPU EXCEPTION" bios-serial.log
            exit 1
          fi
          if ! grep -q "timer heartbeat" bios-serial.log; then
            echo "::error::Timer IRQ0 never fired - interrupts are not being delivered"
            exit 1
          fi
          echo "BIOS boot OK: reached event loop, timer live, no exceptions"

      # Guards the UEFI half of the hybrid ISO. Losing it is invisible under a
      # BIOS-only test, and that regression is exactly what stopped the image
      # booting on modern machines.
      - name: Test QEMU boot (headless, UEFI/OVMF)
        run: |
          set -euo pipefail
          sudo apt-get install -y ovmf
          cp /usr/share/OVMF/OVMF_VARS_4M.fd ./vars.fd 2>/dev/null \
            || cp /usr/share/OVMF/OVMF_VARS.fd ./vars.fd

          timeout 90s qemu-system-x86_64 \
            -drive if=pflash,format=raw,unit=0,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,unit=1,file=./vars.fd \
            -cdrom system71.iso \
            -display none \
            -serial file:uefi-serial.log \
            -m 1024 -vga std \
            -no-reboot || true

          echo "--- last 20 lines of serial ---"
          tail -20 uefi-serial.log || true

          if ! grep -q "Entering event loop" uefi-serial.log; then
            echo "::error::Kernel never reached the event loop under UEFI"
            exit 1
          fi
          if grep -q "CPU EXCEPTION" uefi-serial.log; then
            echo "::error::Kernel took a CPU exception during UEFI boot"
            grep -A3 "CPU EXCEPTION" uefi-serial.log
            exit 1
          fi
          echo "UEFI boot OK: reached event loop, no exceptions"

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-serial-logs
          path: "*-serial.log"
