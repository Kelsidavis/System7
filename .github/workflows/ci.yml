name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

# Keep actions/checkout's temporary repositories from emitting Git's
# first-branch-name hint in every job.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  cadence:
    name: Select CI runs
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      run_ci: ${{ steps.select.outputs.run_ci }}

    steps:
      - name: Select scheduled push runs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" || "$REF_NAME" == refs/tags/v* ]]; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          per_page = 100
          page = 1
          run_id = int(os.environ["RUN_ID"])
          total_count = None
          try:
              run_url = (
                  "https://api.github.com/repos/"
                  f"{os.environ['REPOSITORY']}/actions/runs/{run_id}"
              )
              run_request = urllib.request.Request(run_url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(run_request, timeout=30) as response:
                  workflow_id = json.load(response)["workflow_id"]

              while True:
                  query = urllib.parse.urlencode({
                      "branch": os.environ["BRANCH_NAME"],
                      "event": "push",
                      "per_page": per_page,
                      "page": page,
                  })
                  url = (
                      "https://api.github.com/repos/"
                      f"{os.environ['REPOSITORY']}/actions/workflows/"
                      f"{workflow_id}/runs?{query}"
                  )
                  request = urllib.request.Request(url, headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
                  with urllib.request.urlopen(request, timeout=30) as response:
                      result = json.load(response)

                  if total_count is None:
                      total_count = result["total_count"]
                  runs = result["workflow_runs"]
                  for index, run in enumerate(runs):
                      if run["id"] == run_id:
                          if run["head_branch"] != os.environ["BRANCH_NAME"]:
                              raise RuntimeError("current run branch did not match")
                          ordinal = total_count - ((page - 1) * per_page + index)
                          should_run = ordinal % 10 == 0
                          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                              output.write(f"run_ci={str(should_run).lower()}\n")
                          print(f"Branch push run {ordinal}: full CI {'enabled' if should_run else 'skipped'}")
                          sys.exit(0)

                  if not runs:
                      raise RuntimeError("current run was not found in Actions history")
                  page += 1
          except Exception as error:
              print(f"Could not determine push cadence ({error}); skipping full CI", file=sys.stderr)
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("run_ci=false\n")

  build-x86:
    name: Build x86
    runs-on: ubuntu-24.04
    needs: cadence
    if: needs.cadence.outputs.run_ci == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            xorriso \
            python3 \
            python3-venv \
            vim-common

      - name: Install Python lint tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Build kernel (English)
        run: make PLATFORM=x86

      - name: Run x86 quality gate
        run: make check

      - name: Build ISO (English)
        run: make iso

      - name: Display build info
        run: make info

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v7
        with:
          name: kernel-x86
          path: kernel.elf

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: system71-iso
          path: system71.iso

  build-x86-all-languages:
    name: Build x86 (all languages)
    runs-on: ubuntu-24.04
    needs: cadence
    if: needs.cadence.outputs.run_ci == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            xorriso \
            python3 \
            vim-common

      - name: Build kernel (all languages)
        run: make PLATFORM=x86 LOCALE_ALL=1

      - name: Build ISO (all languages)
        run: make iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: system71-all-languages-iso
          path: system71.iso

  build-x86-configs:
    name: Build x86 (debug and release configs)
    runs-on: ubuntu-24.04
    needs: cadence
    if: needs.cadence.outputs.run_ci == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib python3 vim-common

      # Unoptimised and -O2 builds each catch what the other misses; these
      # configurations stopped compiling unnoticed when nothing built them.
      - name: Build CONFIG=debug
        run: make clean && make PLATFORM=x86 CONFIG=debug

      - name: Build CONFIG=release
        run: make clean && make PLATFORM=x86 CONFIG=release

      - name: Run GCC static analyzer
        run: make analyze

  build-arm64:
    name: Build ARM64
    runs-on: ubuntu-24.04
    needs: cadence
    if: needs.cadence.outputs.run_ci == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            qemu-system-arm \
            python3 \
            vim-common

      - name: Build kernel (ARM64, QEMU virt)
        run: make PLATFORM=arm64

      - name: Upload ARM64 kernel artifact
        uses: actions/upload-artifact@v7
        with:
          name: kernel-arm64
          path: kernel.elf

      - name: Run GCC static analyzer
        run: make analyze-arm64

      - name: Check shadowed definitions
        run: python3 scripts/find-shadowed-defs.py --platform arm64 --obj-dir build/obj/arm64

      - name: Test headless QEMU boot
        run: src/Platform/arm64/test-qemu.sh

  test-stdlib:
    name: C Library Differential Test
    runs-on: ubuntu-24.04
    needs: cadence
    if: needs.cadence.outputs.run_ci == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Compares the in-tree string/memory routines against the host libc with
      # guard bytes around every destination buffer. Needs no kernel build.
      # strncpy shipped for a long time writing one byte past its destination
      # for every caller in the tree; this is the check that would have caught it.
      - name: Run C library differential test
        run: make test-stdlib

  build-arm:
    name: Build ARM
    runs-on: ubuntu-24.04
    needs: cadence
    if: needs.cadence.outputs.run_ci == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-arm-linux-gnueabihf \
            python3 \
            vim-common

      - name: Build kernel (ARM)
        run: make PLATFORM=arm

      - name: Run GCC static analyzer (ARM32)
        run: make analyze-arm

      - name: Check shadowed definitions (ARM32)
        run: python3 scripts/find-shadowed-defs.py --platform arm --obj-dir build/obj/arm

      - name: Upload ARM kernel artifact
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: kernel-arm
          path: kernel.elf

  test-qemu:
    name: QEMU Boot Test
    runs-on: ubuntu-24.04
    needs: [ cadence, build-x86 ]
    if: needs.cadence.outputs.run_ci == 'true'
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86

      - name: Download ISO artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name system71-iso --dir .

      # This step used to pipe everything to `|| true` and echo success
      # unconditionally, so it passed even when the kernel never started at all.
      # It now asserts on the serial log, which is what makes it a real test.
      - name: Test QEMU boot (headless, BIOS)
        run: |
          set -euo pipefail
          timeout 60s qemu-system-i386 \
            -cdrom system71.iso \
            -display none \
            -serial file:bios-serial.log \
            -m 1024 -vga std \
            -no-reboot || true

          echo "--- last 20 lines of serial ---"
          tail -20 bios-serial.log || true

          if ! grep -q "Entering event loop" bios-serial.log; then
            echo "::error::Kernel never reached the event loop"
            exit 1
          fi
          if grep -q "CPU EXCEPTION" bios-serial.log; then
            echo "::error::Kernel took a CPU exception during boot"
            grep -A3 "CPU EXCEPTION" bios-serial.log
            exit 1
          fi
          if ! grep -q "timer heartbeat" bios-serial.log; then
            echo "::error::Timer IRQ0 never fired - interrupts are not being delivered"
            exit 1
          fi
          echo "BIOS boot OK: reached event loop, timer live, no exceptions"

      # Guards the UEFI half of the hybrid ISO. Losing it is invisible under a
      # BIOS-only test, and that regression is exactly what stopped the image
      # booting on modern machines.
      - name: Test QEMU boot (headless, UEFI/OVMF)
        run: |
          set -euo pipefail
          sudo apt-get install -y ovmf
          cp /usr/share/OVMF/OVMF_VARS_4M.fd ./vars.fd 2>/dev/null \
            || cp /usr/share/OVMF/OVMF_VARS.fd ./vars.fd

          timeout 90s qemu-system-x86_64 \
            -drive if=pflash,format=raw,unit=0,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,unit=1,file=./vars.fd \
            -cdrom system71.iso \
            -display none \
            -serial file:uefi-serial.log \
            -m 1024 -vga std \
            -no-reboot || true

          echo "--- last 20 lines of serial ---"
          tail -20 uefi-serial.log || true

          if ! grep -q "Entering event loop" uefi-serial.log; then
            echo "::error::Kernel never reached the event loop under UEFI"
            exit 1
          fi
          if grep -q "CPU EXCEPTION" uefi-serial.log; then
            echo "::error::Kernel took a CPU exception during UEFI boot"
            grep -A3 "CPU EXCEPTION" uefi-serial.log
            exit 1
          fi
          if ! grep -q "timer heartbeat" uefi-serial.log; then
            echo "::error::Timer IRQ0 never fired under UEFI"
            exit 1
          fi
          echo "UEFI boot OK: reached event loop, timer live, no exceptions"

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-serial-logs
          path: "*-serial.log"

  test-integration:
    name: Kernel Integration Tests
    runs-on: ubuntu-24.04
    needs: cadence
    if: needs.cadence.outputs.run_ci == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            xorriso \
            python3 \
            qemu-system-x86 \
            vim-common

      - name: Build and run kernel integration tests
        run: make test-integration

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-integration-results
          path: build/integration-results.xml
          if-no-files-found: ignore
