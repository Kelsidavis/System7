name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-x86:
    name: Build x86
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            xorriso \
            python3 \
            vim-common

      - name: Build kernel (English)
        run: make PLATFORM=x86

      - name: Build ISO (English)
        run: make iso

      - name: Display build info
        run: make info

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-x86
          path: kernel.elf

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: system71-iso
          path: system71.iso

  build-x86-all-languages:
    name: Build x86 (all languages)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            xorriso \
            python3 \
            vim-common

      - name: Build kernel (all languages)
        run: make PLATFORM=x86 LOCALE_ALL=1

      - name: Build ISO (all languages)
        run: make iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: system71-all-languages-iso
          path: system71.iso

  build-x86-configs:
    name: Build x86 (debug and release configs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib python3 vim-common

      # Unoptimised and -O2 builds each catch what the other misses; these
      # configurations stopped compiling unnoticed when nothing built them.
      - name: Build CONFIG=debug
        run: make clean && make PLATFORM=x86 CONFIG=debug

      - name: Build CONFIG=release
        run: make clean && make PLATFORM=x86 CONFIG=release

  build-arm64:
    name: Build ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            python3 \
            vim-common

      - name: Build kernel (ARM64, QEMU virt)
        run: make PLATFORM=arm64

      - name: Upload ARM64 kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-arm64
          path: kernel.elf

  test-stdlib:
    name: C Library Differential Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Compares the in-tree string/memory routines against the host libc with
      # guard bytes around every destination buffer. Needs no kernel build.
      # strncpy shipped for a long time writing one byte past its destination
      # for every caller in the tree; this is the check that would have caught it.
      - name: Run C library differential test
        run: make test-stdlib

  build-arm:
    name: Build ARM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-arm-linux-gnueabihf \
            python3 \
            vim-common

      - name: Build kernel (ARM)
        run: make PLATFORM=arm
        continue-on-error: true

      - name: Upload ARM kernel artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kernel-arm
          path: kernel.elf

  test-qemu:
    name: QEMU Boot Test
    runs-on: ubuntu-latest
    needs: build-x86

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: system71-iso

      # This step used to pipe everything to `|| true` and echo success
      # unconditionally, so it passed even when the kernel never started at all.
      # It now asserts on the serial log, which is what makes it a real test.
      - name: Test QEMU boot (headless, BIOS)
        run: |
          set -euo pipefail
          timeout 60s qemu-system-i386 \
            -cdrom system71.iso \
            -display none \
            -serial file:bios-serial.log \
            -m 1024 -vga std \
            -no-reboot || true

          echo "--- last 20 lines of serial ---"
          tail -20 bios-serial.log || true

          if ! grep -q "Entering event loop" bios-serial.log; then
            echo "::error::Kernel never reached the event loop"
            exit 1
          fi
          if grep -q "CPU EXCEPTION" bios-serial.log; then
            echo "::error::Kernel took a CPU exception during boot"
            grep -A3 "CPU EXCEPTION" bios-serial.log
            exit 1
          fi
          if ! grep -q "timer heartbeat" bios-serial.log; then
            echo "::error::Timer IRQ0 never fired - interrupts are not being delivered"
            exit 1
          fi
          echo "BIOS boot OK: reached event loop, timer live, no exceptions"

      # Guards the UEFI half of the hybrid ISO. Losing it is invisible under a
      # BIOS-only test, and that regression is exactly what stopped the image
      # booting on modern machines.
      - name: Test QEMU boot (headless, UEFI/OVMF)
        run: |
          set -euo pipefail
          sudo apt-get install -y ovmf
          cp /usr/share/OVMF/OVMF_VARS_4M.fd ./vars.fd 2>/dev/null \
            || cp /usr/share/OVMF/OVMF_VARS.fd ./vars.fd

          timeout 90s qemu-system-x86_64 \
            -drive if=pflash,format=raw,unit=0,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,unit=1,file=./vars.fd \
            -cdrom system71.iso \
            -display none \
            -serial file:uefi-serial.log \
            -m 1024 -vga std \
            -no-reboot || true

          echo "--- last 20 lines of serial ---"
          tail -20 uefi-serial.log || true

          if ! grep -q "Entering event loop" uefi-serial.log; then
            echo "::error::Kernel never reached the event loop under UEFI"
            exit 1
          fi
          if grep -q "CPU EXCEPTION" uefi-serial.log; then
            echo "::error::Kernel took a CPU exception during UEFI boot"
            grep -A3 "CPU EXCEPTION" uefi-serial.log
            exit 1
          fi
          echo "UEFI boot OK: reached event loop, no exceptions"

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-serial-logs
          path: "*-serial.log"
